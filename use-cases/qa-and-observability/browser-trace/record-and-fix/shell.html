<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Browserbase — show, don't prompt</title>
<style>
  :root{
    --bg:#0a0b0e; --panel:#101218; --surface:#171a22; --surface2:#1c202b;
    --border:#242833; --border-soft:#1e222c; --text:#eceef4; --muted:#9297a6; --faint:#666c7c;
    --accent:#7c68fa; --accent-2:#9d8bff; --rec:#ff5c5c; --bb:#f24e29; --good:#5ed19b; --amber:#e9b667;
  }
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;overflow:hidden;color:var(--text);
    background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-feature-settings:'cv02','ss01'}
  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-thumb{background:#2a2f3b;border-radius:8px;border:3px solid var(--panel)}

  /* ---- left: chat ---- */
  .chat{width:432px;flex:none;display:flex;flex-direction:column;background:var(--panel);
    border-right:1px solid var(--border);position:relative}
  .chat:before{content:'';position:absolute;inset:0 0 auto;height:120px;
    background:radial-gradient(120% 100% at 0 0,rgba(124,104,250,.10),transparent 70%);pointer-events:none}
  .chat-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px;position:relative}
  .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(140deg,var(--accent),#5b8bff);
    box-shadow:0 4px 14px rgba(124,104,250,.4);flex:none}
  .chat-head b{font-size:15px;font-weight:650;letter-spacing:-.2px}
  .chat-head .badge{margin-left:auto;font-size:11px;color:var(--muted);border:1px solid var(--border);
    padding:3px 9px;border-radius:20px;letter-spacing:.2px}
  .msgs{flex:1;overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:86%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.55;
    animation:pop .28s cubic-bezier(.2,.8,.2,1);letter-spacing:-.1px}
  .agent{background:var(--surface);border:1px solid var(--border-soft);align-self:flex-start;border-bottom-left-radius:5px}
  .user{background:linear-gradient(135deg,var(--accent),#6d7bff);align-self:flex-end;
    border-bottom-right-radius:5px;color:#fff;box-shadow:0 4px 16px rgba(124,104,250,.28)}
  .msg b{font-weight:650}

  /* diagnostic bundle card */
  .artifact{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:16px;max-width:94%;font-size:13px;box-shadow:0 10px 34px rgba(0,0,0,.32)}
  .artifact h4{margin:0 0 12px;font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:7px;letter-spacing:-.2px}
  .artifact img{margin-top:12px;width:100%;border-radius:10px;border:1px solid var(--border)}
  .artifact .sec{margin:14px 0 6px;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);font-weight:700}
  .artifact .quote{background:var(--surface2);border-left:2px solid var(--accent);padding:9px 11px;border-radius:8px;color:#dfe2ee;font-size:12.5px;line-height:1.5}
  .artifact pre.code{background:#0b0d13;border:1px solid var(--border);border-radius:10px;padding:12px;overflow-x:auto;
    font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.6;color:#c7d3ee;white-space:pre;margin:4px 0 0}
  .tl{list-style:none;margin:4px 0 0;padding:0}
  .tl li{display:flex;gap:9px;padding:4px 0;align-items:flex-start;color:#c9cdd9;font-size:12.8px;line-height:1.5}
  .tl li .ic{flex:none;width:18px;text-align:center;opacity:.9}
  .tl li.voice{color:var(--accent-2)} .tl li.note{color:var(--amber)}

  .diff{background:#0b0d13;border:1px solid var(--border);border-radius:10px;padding:11px 13px;
    font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:12px;line-height:1.65;margin-top:8px;white-space:pre-wrap}
  .diff .del{color:#ff8f8f} .diff .add{color:var(--good)}

  .typing{display:flex;gap:5px;padding:14px 15px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}

  /* composer */
  .composer{padding:16px 18px 18px;border-top:1px solid var(--border);background:linear-gradient(180deg,transparent,rgba(124,104,250,.03))}
  .btn{width:100%;padding:14px;border:0;border-radius:13px;font-size:15px;font-weight:650;cursor:pointer;letter-spacing:-.2px;
    background:linear-gradient(135deg,var(--accent),#6d7bff);color:#fff;transition:transform .1s ease,box-shadow .2s ease,opacity .2s;
    box-shadow:0 6px 20px rgba(124,104,250,.32)}
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(124,104,250,.42)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.45;cursor:default;box-shadow:none;transform:none}
  .btn.rec{background:linear-gradient(135deg,#ff5c5c,#ff7a45);box-shadow:0 6px 20px rgba(255,92,92,.32)}
  .hint{font-size:12px;color:var(--faint);text-align:center;margin-top:10px;letter-spacing:-.1px}
  .caption{font-size:12px;color:var(--accent-2);min-height:15px;margin-bottom:8px}
  .notebar{display:none;gap:8px;margin-bottom:10px}
  .notebar input{flex:1;padding:11px 13px;border:1px solid var(--border);border-radius:11px;background:var(--surface);
    color:var(--text);font-size:13px;outline:none;transition:border-color .15s}
  .notebar input::placeholder{color:var(--faint)}
  .notebar input:focus{border-color:var(--accent)}
  .mic{flex:none;width:46px;border:1px solid var(--border);border-radius:11px;background:var(--surface);font-size:17px;cursor:pointer;transition:.15s}
  .mic:hover{border-color:var(--accent)}
  .mic.on{background:linear-gradient(135deg,#ff5c5c,#ff7a45);border-color:transparent;animation:pulse 1.3s infinite}

  /* ---- right: preview (browser chrome) ---- */
  .preview{flex:1;display:flex;flex-direction:column;background:#07080b}
  .pv-head{height:54px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;
    background:var(--panel);border-bottom:1px solid var(--border)}
  .dots{display:flex;gap:7px;flex:none}
  .dots i{width:11px;height:11px;border-radius:50%;display:block}
  .dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
  .url{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:8px 14px;
    font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px;letter-spacing:-.1px}
  .rec-badge{display:none;align-items:center;gap:7px;color:#ff8a8a;font-size:12.5px;font-weight:600}
  .rec-badge.on{display:flex}
  .rec-badge .d{width:8px;height:8px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 0 rgba(255,92,92,.5);animation:ring 1.3s infinite}
  .bb{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .bb .bmark{width:16px;height:16px;border-radius:4px;background:var(--bb);color:#fff;font-size:11px;font-weight:800;
    display:inline-flex;align-items:center;justify-content:center}
  .bb b{color:var(--text);font-weight:600}
  .frame-wrap{flex:1;position:relative}
  iframe{width:100%;height:100%;border:0;background:#fff}
  .scrim{position:absolute;inset:0;display:none;pointer-events:none;box-shadow:inset 0 0 0 3px rgba(255,92,92,.75)}
  .scrim.on{display:block}

  @keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.62}}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,92,92,.5)}70%{box-shadow:0 0 0 6px rgba(255,92,92,0)}100%{box-shadow:0 0 0 0 rgba(255,92,92,0)}}
</style>
</head>
<body>
  <!-- LEFT: builder-style chat -->
  <div class="chat">
    <div class="chat-head"><div class="logo"></div><b>Builder</b><span class="badge" id="appbadge">preview</span></div>
    <div class="msgs" id="msgs"></div>
    <div class="composer">
      <div class="caption" id="caption"></div>
      <div class="notebar" id="notebar">
        <input id="note" placeholder="Add a note — what's wrong / what should happen…" />
        <button class="mic" id="mic" title="Speak your notes">🎤</button>
      </div>
      <button class="btn" id="action">Show me the bug</button>
      <div class="hint" id="hint">Instead of typing it out, just click through it in the preview →</div>
    </div>
  </div>

  <!-- RIGHT: Browserbase live preview -->
  <div class="preview">
    <div class="pv-head">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="url" id="urlbar">🔒 preview.app</div>
      <div class="rec-badge" id="recBadge"><span class="d"></span> Recording</div>
      <div class="bb">powered by <span class="bmark">B</span> <b>Browserbase</b></div>
    </div>
    <div class="frame-wrap">
      <iframe id="frame" title="preview"></iframe>
      <div class="scrim" id="scrim"></div>
    </div>
  </div>

<script>
const msgs = document.getElementById('msgs');
const action = document.getElementById('action');
const hint = document.getElementById('hint');
const recBadge = document.getElementById('recBadge');
const scrim = document.getElementById('scrim');
const frame = document.getElementById('frame');
const notebar = document.getElementById('notebar');
const noteInput = document.getElementById('note');
const mic = document.getElementById('mic');
const caption = document.getElementById('caption');

const esc = (s)=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function bubble(text, cls='agent'){ const d=document.createElement('div'); d.className='msg '+cls; d.innerHTML=text; msgs.appendChild(d); msgs.scrollTop=1e9; return d; }

// --- notes + voice: interleave "what I meant" with "what I did" ---
function postNote(kind, text){
  if(!text || !text.trim()) return;
  api('note','POST',{kind, text:text.trim(), ts:Date.now()})
    .then(()=>bubble((kind==='voice'?'🗣️ ':'📝 ')+esc(text.trim()), 'user'))
    .catch((error)=>showError(error, 'Could not save that note.'));
}
noteInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ postNote('note', noteInput.value); noteInput.value=''; }});

// Voice via MediaRecorder -> server -> OpenAI Whisper. Auto-starts with recording;
// the 🎤 button pauses/resumes (never discards audio); Done flushes + transcribes.
let mediaRec=null, chunks=[], audioOn=false, recStart=0, audioEpoch=0, pendingAudio=null;
async function startAudio(){
  if(pendingAudio) return pendingAudio;
  const epoch=audioEpoch;
  pendingAudio=(async()=>{
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    if(epoch!==audioEpoch || state!=='recording'){
      stream.getTracks().forEach((track)=>track.stop());
      return false;
    }
    chunks=[]; mediaRec=new MediaRecorder(stream);
    mediaRec.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    mediaRec.start(1000);                       // 1s timeslices so nothing is lost
    audioOn=true; mic.classList.add('on');
    caption.textContent='🎤 Recording your narration… say what’s wrong / what should happen.';
    return true;
  }catch(_){
    if(epoch===audioEpoch && state==='recording'){
      audioOn=false; mic.classList.remove('on'); caption.textContent='';
      bubble('ℹ️ Voice is off (mic not allowed). Click the 🎤 to enable it, or use typed notes.');
    }
    return false;
  }
  })();
  try{return await pendingAudio;}finally{pendingAudio=null;}
}
mic.onclick = async ()=>{
  if(!mediaRec || mediaRec.state==='inactive'){ await startAudio(); return; }
  if(mediaRec.state==='recording'){ try{mediaRec.pause();}catch(_){}; mic.classList.remove('on'); caption.textContent='🎤 paused — click 🎤 to resume.'; }
  else if(mediaRec.state==='paused'){ try{mediaRec.resume();}catch(_){}; mic.classList.add('on'); caption.textContent='🎤 Recording your narration…'; }
};
async function finishAudio(){
  audioEpoch+=1;
  const acquiring=pendingAudio;
  if(acquiring){try{await acquiring;}catch(_){}}
  return new Promise((resolve)=>{
    audioOn=false; mic.classList.remove('on');
    const mk = () => (chunks.length ? new Blob(chunks, { type: (mediaRec && mediaRec.mimeType) || 'audio/webm' }) : null);
    if(!mediaRec || mediaRec.state==='inactive'){
      try{mediaRec?.stream?.getTracks().forEach(t=>t.stop());}catch(_){}
      mediaRec=null; resolve(mk()); return;
    }
    mediaRec.onstop=()=>{ try{ mediaRec.stream.getTracks().forEach(t=>t.stop()); }catch(_){}; mediaRec=null; resolve(mk()); };
    try{ mediaRec.stop(); }catch(_){ try{mediaRec?.stream?.getTracks().forEach(t=>t.stop());}catch(_){}; mediaRec=null; resolve(mk()); }
  });
}
function typing(){ const d=document.createElement('div'); d.className='msg agent typing'; d.innerHTML='<i></i><i></i><i></i>'; msgs.appendChild(d); msgs.scrollTop=1e9; return d; }
const sleep = (ms)=>new Promise(r=>setTimeout(r,ms));
async function api(path, method='GET', body){
  const response=await fetch('/api/'+path,{method,headers:body?{'content-type':'application/json'}:undefined,
    body:body?JSON.stringify(body):undefined});
  let payload;
  try{payload=await response.json();}catch(_){throw new Error(`Server returned invalid JSON (${response.status}).`);}
  if(!response.ok) throw new Error(payload?.error || `Request failed (${response.status}).`);
  if(!payload || typeof payload!=='object') throw new Error('Server returned an invalid response.');
  return payload;
}
function showError(error, fallback){
  bubble('⚠️ '+esc(error?.message || fallback));
}
function validateBundle(payload){
  if(!Array.isArray(payload?.timeline) || !Array.isArray(payload?.elements) ||
    !Number.isInteger(payload.actions) || !Number.isInteger(payload.notes)){
    throw new Error('Recorder returned an incomplete diagnostic bundle.');
  }
  return payload;
}
function requireOk(payload, actionName){
  if(payload?.ok!==true) throw new Error(`${actionName} was not confirmed by the server.`);
  return payload;
}

let cfg = { recordOnly: false, appName: 'TaskFlow' };
// boot: load the live Browserbase preview
(async () => {
  try{
  cfg = await api('config');
  const { liveUrl } = await api('live');
  if(typeof liveUrl!=='string' || !liveUrl) throw new Error('Live view is unavailable.');
  frame.src = liveUrl;
  const name = cfg.appName || 'TaskFlow';
  const slug = name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  const ab = document.getElementById('appbadge'); if (ab) ab.textContent = name;
  const ub = document.getElementById('urlbar'); if (ub) ub.textContent = '🔒 ' + slug + '.app';
  bubble(`✨ <b>${name}</b> is live — preview it on the right.`);
  await sleep(400);
  bubble("Something not working? Don't type it out — hit <b>Show me the bug</b> and just demonstrate it in the preview.");
  }catch(error){showError(error,'Could not start the demo.'); action.disabled=true;}
})();

let state = 'idle';
let bundleReady = false;
function showFixLoaded(){
  bubble('✅ <b>Fixed preview loaded.</b> The Add button now renders the task — try it in the preview.');
  hint.textContent = 'Same flow works for any bug — record it, don’t describe it.';
  action.textContent = '↺ Reset demo'; action.disabled = false; state = 'done';
}
async function runAction(){
  if (state === 'idle') {           // start recording
    recStart = Date.now();
    requireOk(await api('record/start','POST'), 'Recording start');
    state = 'recording';
    recBadge.classList.add('on'); scrim.classList.add('on');
    notebar.style.display = 'flex';
    action.textContent = '⏹ Done showing'; action.classList.add('rec');
    bubble('Let me show you what’s broken →', 'user');
    hint.textContent = 'Reproduce it in the preview and just talk — narrate what’s wrong, then “Done showing”.';
    void startAudio();   // acquisition is cancelled and joined by Done
  } else if (state === 'recording') {  // stop + hand off to the "agent"
    state = 'thinking';
    action.disabled = true; action.textContent = 'Analyzing…'; action.classList.remove('rec');
    recBadge.classList.remove('on'); scrim.classList.remove('on');
    notebar.style.display = 'none'; caption.textContent='';
    // finalize mic audio + transcribe via Whisper BEFORE building the bundle
    const blob = await finishAudio();
    if (blob && blob.size) {
      const tb = bubble('🎤 Transcribing your voice with Whisper…');
      try {
        const response = await fetch('/api/transcribe?recStart='+recStart+'&mime='+encodeURIComponent(blob.type), { method:'POST', body: blob });
        const tr = await response.json();
        if(!response.ok) throw new Error(tr?.error || `Transcription failed (${response.status}).`);
        tb.remove();
        if (tr && tr.ok && (tr.text||'').trim()) bubble('🗣️ Heard: “'+esc(tr.text.trim())+'”', 'user');
        else if (tr && tr.ok) bubble('🎤 Got the audio, but Whisper detected no speech. Speak a bit louder / longer.');
        else bubble('⚠️ Transcription failed: '+esc((tr&&tr.error)||'unknown'));
      } catch(_){ tb.remove(); bubble('⚠️ Transcription request errored.'); }
    } else {
      bubble('ℹ️ No voice this time — click <b>🎤</b> during recording to narrate, and I’ll transcribe it. (Typed notes still work.)');
    }
    const { timeline, actions, notes:noteCount, code, elements, voiceText, noteText } = validateBundle(await api('record/stop','POST'));

    // diagnostic bundle = recording + voice + element-level state + source code
    const art = document.createElement('div'); art.className='artifact';
    let html = `<h4>📦 Diagnostic bundle for the fixer</h4>`;
    html += `<div class="sec">Recording · ${actions} actions${noteCount?` + ${noteCount} notes`:''}</div>`;
    html += `<ul class="tl">${timeline.map(i=>`<li class="${i.kind}"><span class="ic">${i.icon}</span><span>${esc(i.text)}</span></li>`).join('')}</ul>`;
    if (voiceText) html += `<div class="sec">🗣 What you said</div><div class="quote">${esc(voiceText)}</div>`;
    if (noteText)  html += `<div class="sec">📝 Notes</div><div class="quote">${esc(noteText)}</div>`;
    const clicks = (elements||[]).filter(e=>e.type==='click');
    const key = clicks[clicks.length-1] || (elements||[])[0];
    if (key && key.el) {
      const a=key.el.attrs||{}, d=key.el.data||{};
      const st=[...Object.entries(a).map(([k,v])=>`${k}=${v}`), ...Object.entries(d).map(([k,v])=>`data-${k}=${v}`)].join(' · ') || 'no special state';
      html += `<div class="sec">🎯 Exact element</div><div class="quote">&lt;${esc(key.el.tag)}&gt; “${esc(key.name||'')}” · role ${esc(key.role||'')}<br>${esc(st)}<br>visible: ${key.el.visible}</div>`;
    }
    if (code) {
      html += `<div class="sec">🧩 Matched source (${esc(code.match)}) · ${esc(code.file)}${code.handler?` · ${esc(code.handler)}()`:''} · line ${code.startLine}</div>`
        + `<pre class="code">${esc(code.snippet)}</pre>`;
    }
    html += `<img src="/api/shot?t=${Date.now()}" alt="screenshot"/>`;
    art.innerHTML = html;
    msgs.appendChild(art); msgs.scrollTop=1e9;
    bundleReady = true;
    bubble('☝️ This is the bug. Fix it.', 'user');

    if (cfg.recordOnly) {
      const t0 = typing(); await sleep(1300); t0.remove();
      bubble('Got it — the bundle preserves what you <b>did</b>, what you <b>said</b>, and the captured <b>element + its state</b>. Matched source is included only when a recorded element token maps to the route file.');
      bubble('📦 <b>This bundle is what the fixer receives</b> — recording + voice + element-level state, plus any token-matched source context.');
      hint.textContent = 'Same flow for any bug — show it, don’t describe it.';
      action.textContent = '↺ Reset demo'; action.disabled = false; state = 'done';
      return;
    }

    const t = typing(); await sleep(1600); t.remove();
    bubble('Got it — I can see from your recording that you typed a task and clicked <b>Add task</b>, but nothing rendered. The click handler updates state but never appends to the list:');
    bubble(`<div class="diff"><span class="del">- console.log('would add:', val); // ❌ never renders</span>\n<span class="add">+ addTask(val); // ✅ append &lt;li&gt; to the list</span></div>`);
    const t2 = typing(); await sleep(1200); t2.remove();
    requireOk(await api('fix','POST'), 'Fixed preview');   // navigate the live session to the fixed build
    showFixLoaded();
  } else if(state === 'fix-retry') {
    action.disabled=true; action.textContent='Loading fixed preview…';
    requireOk(await api('fix','POST'), 'Fixed preview');
    showFixLoaded();
  } else if (state === 'done') {
    requireOk(await api('reset','POST'), 'Reset'); location.reload();
  }
}
action.onclick = async () => {
  try{await runAction();}
  catch(error){
    showError(error, 'The recorder request failed.');
    action.disabled=false;
    if(state==='done'){
      action.textContent='Retry reset';
      hint.textContent='Reset failed. The current diagnostic bundle remains available.';
    }else if(bundleReady && !cfg.recordOnly){
      state='fix-retry'; action.textContent='Retry loading fixed preview';
      hint.textContent='Your diagnostic bundle is preserved. Retry when the server is available.';
    }else if(state==='thinking'){
      state='recording'; action.textContent='Retry finishing';
      hint.textContent='Your recording is preserved on the server. Retry finishing the bundle.';
    }else{
      state='idle'; action.textContent='Show me the bug';
    }
  }
};
</script>
</body>
</html>
