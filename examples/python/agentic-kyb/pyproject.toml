[project]
name = "agentic-kyb-example"
version = "0.1.0"
description = "Evidence-backed public-registry research with Stagehand v4 and Browserbase"
requires-python = ">=3.11,<3.14"
dependencies = ["stagehand==4.1.0", "pydantic>=2.12,<3", "python-dotenv>=1.2,<2"]

[dependency-groups]
dev = ["ruff==0.16.8", "mypy>=1.19,<2"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
