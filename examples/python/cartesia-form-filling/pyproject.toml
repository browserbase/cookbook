[project]
name = "browserbase-form-filler"
version = "0.1.0"
description = "Voice agent that fills web forms using Stagehand browser automation"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cartesia-line==0.1.12",
    "fastapi==0.115.14",
    "stagehand==4.2.1",
    "google-genai>=1.75.0",
    "python-dotenv>=1.2.4",
    "loguru>=0.7.3",
    "aiohttp>=3.14.5",
    "pydantic>=2.14.1",
    "PyYAML>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = []
