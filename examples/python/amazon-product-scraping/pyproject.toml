[project]
name = "amazon-product-scraping"
version = "0.1.0"
description = "Scrape Amazon product search results using Stagehand and Browserbase"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "beautifulsoup4==4.15.0",
    "pydantic>=2.14.1,<3",
    "python-dotenv==1.2.4",
    "stagehand==4.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "black>=23.12.1",
    "ruff>=0.1.15",
]

[build-system]
requires = ["setuptools>=61.3.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
